name: Feature request (English)
description: Propose an S6E3-compatible improvement
title: "[FEATURE] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      placeholder: What problem does this solve
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      placeholder: What exactly should be added or changed
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: S6E3 constraints
      description: Confirm this does not require later-season content
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      placeholder: Which options were considered
