name: Bug report
description: Сообщить об ошибке в сервере, клиенте или инструментах
title: "[BUG] "
labels:
  - bug
body:
  - type: input
    id: component
    attributes:
      label: Компонент
      placeholder: GameServer / DataServer / Main5.2 / UpdaterService
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Краткое описание
      placeholder: Что сломано
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      placeholder: "1) ...\n2) ...\n3) ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Логи или скриншоты
      description: Удалите секреты и персональные данные
