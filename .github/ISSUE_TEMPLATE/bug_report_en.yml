name: Bug report (English)
description: Report a bug in server, client, or tools
title: "[BUG] "
labels:
  - bug
body:
  - type: input
    id: component
    attributes:
      label: Component
      placeholder: GameServer / DataServer / Main5.2 / UpdaterService
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      placeholder: What is broken
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1) ...\n2) ...\n3) ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove secrets and personal data
